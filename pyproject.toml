[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "J.A.R.V.I.S. - an original, local-first Windows AI desktop assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JARVIS Project" }]
keywords = ["windows", "assistant", "automation", "ai", "voice"]

dependencies = [
    "PySide6-Essentials>=6.8",
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psutil>=6.0",
    "pywin32>=306",
    "comtypes>=1.4",
    "pyttsx3>=2.90",
    "sounddevice>=0.5",
    "SpeechRecognition>=3.10",
    "vosk>=0.3.44",
    "numpy>=1.26",
    "mss>=9.0",
    "uiautomation>=2.0",
    "pycaw>=20240210",
    "screen-brightness-control>=0.23",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
jarvis = "jarvis.ui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]